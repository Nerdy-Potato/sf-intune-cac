name: Convert device tier groups to dynamic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm preflight, device tagging, and in-place conversion of all three groups'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cac-device-tier-writes
  cancel-in-progress: false

jobs:
  convert:
    name: Tag existing members and convert group membership in place
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit confirmation
        shell: pwsh
        env:
          APPLY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:APPLY_CONFIRM -ne 'true') {
            throw 'Requires confirm=true to stamp existing group members and convert all three groups in place.'
          }

      - name: Check tenant identity is configured
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
        run: |
          if (-not $env:AZURE_TENANT_ID -or -not $env:AZURE_CLIENT_ID) {
            throw 'AZURE_TENANT_ID and AZURE_APPLY_CLIENT_ID repository variables must be set.'
          }

      - name: Convert all device tier groups to dynamic
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
        run: |
          ./scripts/bootstrap/Convert-CaCDeviceTierGroupsToDynamic.ps1 -Confirm:$false
